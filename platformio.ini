; Claude Hardware Buddy (Shenron) firmware — ES3N28P (ESP32-S3-N16R8, ILI9341 240x320 SPI, FT6336G touch)
; BLE reuses the buddy NUS protocol (see ../REFERENCE.md); display via LovyanGFX.
[env:es3n28p]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; No fixed COM number: PlatformIO auto-detects the port by the board's USB VID:PID
; (ESP32-S3 native USB-Serial-JTAG, 303A:1001), so replugs/reboots that change the
; COM number just work. Override per-run with `--upload-port COMx` only if needed.

; N16R8: 16MB flash + 8MB Octal(OPI) PSRAM. huge_app = 3MB app (fits Bluedroid BLE).
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = huge_app.csv

build_flags =
  -DBOARD_HAS_PSRAM
  ; Native USB-Serial-JTAG for logs on COM3 (same as the Rust build used).
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=0

lib_deps =
  lovyan03/LovyanGFX @ ^1.1.16
  bblanchon/ArduinoJson @ ^7.0.0
